[package]
name = "stratx_auction"
version = "0.2.0"
description = "StratX offer auction for strategy access licences, paid in USDC (Devnet MVP, not audited)"
edition = "2021"
# Platform tools for Agave 2.1 (Anchor 0.31.1's target) ship Rust 1.79; keeps dependency resolution compatible.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "stratx_auction"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# token_2022 is required by anchor-spl's idl-build (it references token_interface unconditionally).
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
